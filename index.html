<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdb225">
<title>칭찬적금</title>
<style>
:root{
  --main:#fdb225;
  --bg:#f7f7f9; --card:#ffffff; --text:#1c1d21; --sub:#6b6f76; --line:#e6e7eb; --soft:#f0f1f4;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121316; --card:#1c1d21; --text:#f2f3f5; --sub:#9aa0a8; --line:#2c2e34; --soft:#25272c; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.5; padding-bottom:80px;
  -webkit-user-select:none; user-select:none;
}
header{position:sticky; top:0; z-index:20; background:var(--bg); padding:14px 16px 8px; border-bottom:1px solid var(--line)}
h1{font-size:19px; margin:0; letter-spacing:-.4px}
h1 span{color:var(--main)}
.balance{margin-top:10px; display:flex; gap:8px}
.bcard{flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px}
.bcard .lb{font-size:11px; color:var(--sub)}
.bcard .vl{font-size:17px; font-weight:800; letter-spacing:-.5px}
.accent{color:var(--main)}
.segs{display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; margin-top:10px}
.segs button{flex:1; border:0; background:transparent; color:var(--sub); font-size:13px; font-weight:700; padding:7px; border-radius:9px; font-family:inherit}
.segs button.on{background:var(--main); color:#1c1d21}
.datebar{display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-size:13px; font-weight:700}
.datebar .lbl{flex:1; text-align:center; padding:6px; border-radius:9px; background:var(--card); border:1px solid var(--line); margin:0 8px}
.datebar button{border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:9px; width:32px; height:30px; font-family:inherit}
main{padding:14px 16px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px}
.card.drag{opacity:.5; border-color:var(--main)}
.card.reorder{border-color:var(--main); border-style:dashed}
.card h2{font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:7px; letter-spacing:-.3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pay{margin-left:auto; font-weight:800; font-size:14px}
.row{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px dashed var(--line); font-size:13.5px}
.row.nb{border-top:0}
.row .g{margin-left:auto; color:var(--sub); font-size:12.5px; text-align:right}
.muted{color:var(--sub); font-size:12.5px}
input,select,button,textarea{font-family:inherit; font-size:14px}
input[type=number],input[type=text],input[type=date],select{background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 10px; width:100%}

/* 수정할 CSS 부분 */
.tinput { display: flex; gap: 6px; align-items: center; }
.tinput input { text-align: center; padding: 9px 4px; }
.tinput em { font-style: normal; color: var(--sub); font-size: 12px; }
.tinput .btn { margin-left: auto; padding: 7px 12px; font-size: 14px; } /* 체크 표시를 위해 패딩과 크기 살짝 조정 */

.btn{background:var(--main); color:#1c1d21; border:0; border-radius:11px; padding:10px 14px; font-weight:800}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text); font-weight:700}
.btn.sm{padding:7px 10px; font-size:12.5px; border-radius:9px}
.btn.xs{padding:3px 8px; font-size:11.5px; border-radius:8px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:20px; padding:6px 11px; font-size:12.5px; font-weight:700}
/* 체크 */
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg);flex:none;position:relative;padding:0}
.ck:after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid transparent;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.ck.on{background:var(--main);border-color:var(--main);box-shadow:0 0 0 4px color-mix(in srgb,var(--main) 25%,transparent)}
.ck.on:after{border-color:#1c1d21}
nav{position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding:6px 0 calc(6px + env(safe-area-inset-bottom)); z-index:30}
nav button{flex:1; border:0; background:transparent; color:var(--sub); font-size:11px; font-weight:700; padding:5px 0}
nav button b{display:block; font-size:18px; font-weight:400; line-height:1.3}
nav button.on{color:var(--main)}
.wk{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:4px}
.wk>div{text-align:center; font-size:11px; color:var(--sub)}
.wk .bar{height:56px; background:var(--soft); border-radius:7px; display:flex; align-items:flex-end; overflow:hidden; border:1px solid var(--line)}
.wk .bar.sel{border-color:var(--main); border-width:2px}
.wk .bar i{display:block; width:100%}
.wk .amt{font-size:11.5px; font-weight:800; color:var(--text)}
.today{color:var(--main); font-weight:800}
.sec{font-size:12px; color:var(--sub); font-weight:800; margin:18px 2px 8px; letter-spacing:.3px}
.f{margin-bottom:10px}
.f label{display:block; font-size:12px; color:var(--sub); margin-bottom:4px; font-weight:700}
.g2{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px}
.g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px}
.item{border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; background:var(--bg)}
.item .t{font-weight:800; font-size:13.5px; display:flex; align-items:center; gap:6px}
.del{margin-left:auto; background:transparent; border:0; color:var(--sub); font-size:15px; padding:2px 6px}
.hidden{display:none}
img.tt{width:100%; border-radius:12px; border:1px solid var(--line); margin-top:8px}
/* 모달 */
.mask{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:18px}
.modal{background:var(--card); border-radius:18px; width:100%; max-width:380px; padding:16px; max-height:86vh; overflow:auto}
.modal h3{margin:0 0 12px; font-size:15px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal .h{font-size:11px;color:var(--sub);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1; border:1px solid transparent; background:var(--soft); border-radius:9px; color:var(--text); font-size:13px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0}
.cal button.off{opacity:.3}
.cal button.sel{background:var(--main); color:#1c1d21}
.cal button.tod{border-color:var(--main)}
.cal button small{font-size:9px; font-weight:700; opacity:.75}
.cal button.inwk{background:color-mix(in srgb,var(--main) 22%,var(--soft))}
.grip{color:var(--sub); font-size:15px; cursor:grab; padding:0 2px}
.mono{font-variant-numeric:tabular-nums}
.toast{position:fixed; left:50%; top:14px; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); color:var(--text); padding:9px 16px; border-radius:20px; font-size:12.5px; font-weight:700; box-shadow:0 6px 18px rgba(0,0,0,.18); z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88vw; text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>칭찬<span>적금</span></h1>
  <div class="balance">
    <div class="bcard"><div class="lb">쓸 수 있는 돈</div><div class="vl accent" id="bal">0원</div></div>
    <div class="bcard"><div class="lb">누적 적립</div><div class="vl" id="tot">0원</div></div>
  </div>
  <div class="segs" id="segs">
    <button onclick="setMode('day')">일간</button>
    <button onclick="setMode('week')">주간</button>
    <button onclick="setMode('month')">월간</button>
  </div>
  <div class="datebar" id="datebar">
    <button onclick="shift(-1)">‹</button>
    <span class="lbl" id="dlabel" onclick="openCal()"></span>
    <button onclick="shift(1)">›</button>
  </div>
</header>

<main id="app"></main>

<nav>
  <button id="n-home" class="on" onclick="go('home')"><b>😎</b>홈</button>
  <button id="n-class" onclick="go('class')"><b>📚</b>수업</button>
  <button id="n-spend" onclick="go('spend')"><b>💸</b>사용</button>
  <button id="n-set" onclick="go('set')"><b>⚙︎</b>설정</button>
</nav>

<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* ============ 상태 ============ */
const KEY='chingchan_v2';
function defState(){return{
  settings:{
    main:'#fdb225',
    studyUnit:1000, incA:500, incB:1000,
    msPrevMonth:5000, msYear:10000, msBest:50000, autoBase:true,
    attend:500, noLate:500, focusPerHour:1000, focusRate:70,
    spendView:'month', spendFold:false, classFold:false,
    cloud:{
      url:'https://yfxzyhevluxmvwuunoei.supabase.co',
      key:'sb_publishable_VAV8tW-MNC7OfH9otxRq3Q_h0HuLQ1p',
      code:'my-only-room'
    }
  },
  
  themes:[
    {id:'study', name:'공부', color:'#fdb225', kind:'study'},
    {id:'self',  name:'자기관리', color:'#5ec48a', kind:'check', items:[{id:'ex', label:'운동', amount:1000}]},
    {id:'class', name:'수업', color:'#5aa9e6', kind:'class'}
  ],
  base:{},        // 'YYYY-MM' : {prev,year,best} (초)
  classes:[], logs:{}, ledger:[], tt:null
};}
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.themes){r.settings={...defState().settings,...r.settings}; return {...defState(),...r};}}catch(e){}
  return defState();
}
let cloudTimer=null;
function save(){
  localStorage.setItem(KEY,JSON.stringify(S));
  const c=S.settings.cloud;
  if(c&&c.url&&c.key&&c.code){
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(()=>pushCloud(true),1200);
  }
}

/* ============ 유틸 ============ */
const DAYS=['일','월','화','수','목','금','토'];
let cur=new Date(); cur.setHours(0,0,0,0);
let mode='day', page='home', weekPick=null, reorder=false;
const k=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ym=d=>k(d).slice(0,7);
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
function weekRange(d){const s=new Date(d);s.setDate(s.getDate()-((s.getDay()+6)%7));const e=new Date(s);e.setDate(e.getDate()+6);return[s,e];}
const won=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR')+'원';
const hm =s=>`${String(Math.floor(s/3600)).padStart(2,'0')}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(key){const l=S.logs[key]||(S.logs[key]={});l.studySec=l.studySec||0;l.check=l.check||{};l.cls=l.cls||{};return l;}
const T=id=>S.themes.find(t=>t.id===id);

/* ============ 마일스톤 기준 ============ */
function baseOf(key){
  const m=key.slice(0,7);
  if(S.base[m]) return S.base[m];
  if(!S.settings.autoBase) return {prev:0,year:0,best:0};
  const d=parse(key);
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const nd=new Date(pm.getFullYear(),pm.getMonth()+1,0).getDate();
  let ps=0; for(let i=1;i<=nd;i++) ps+=(S.logs[k(new Date(pm.getFullYear(),pm.getMonth(),i))]?.studySec||0);
  let ys=0,yc=0,best=0;
  for(const kk in S.logs){ if(kk.startsWith(d.getFullYear()+'-')&&kk!==key){const v=S.logs[kk].studySec||0; ys+=v; yc++; if(v>best)best=v;} }
  return {prev:Math.floor(ps/nd), year:yc?Math.floor(ys/yc):0, best};
}

/* ============ 정산 ============ */
function calcStudy(key){
  const st=S.settings, sec=log(key).studySec, n=Math.floor(sec/1800);
  const base=n*st.studyUnit;
  let inc=0; if(n>=2&&n<=6)inc=st.incA*n; else if(n>=7)inc=st.incB*(n-3);
  const b=baseOf(key); const ms=[];
  if(sec>0&&b.prev>0&&sec>b.prev) ms.push(['전월 평균 돌파',st.msPrevMonth]);
  if(sec>0&&b.year>0&&sec>b.year) ms.push(['연 평균 돌파',st.msYear]);
  if(sec>0&&b.best>0&&sec>b.best) ms.push(['연간 최고기록',st.msBest]);
  const msSum=ms.reduce((a,x)=>a+x[1],0);
  return {sec,n,base,inc,ms,msSum,b,total:base+inc+msSum};
}
function calcCheck(t,key){
  const c=log(key).check[t.id]||{}; let total=0;
  (t.items||[]).forEach(i=>{ if(c[i.id]) total+=i.amount; });
  return {total};
}
function classesOn(key){
  const w=parse(key).getDay();
  return S.classes.filter(c=>(!c.start||key>=c.start)&&(!c.end||key<=c.end)&&(c.days?.[w]||0)>0)
    .sort((a,b)=>((a.ord?.[w]??99)-(b.ord?.[w]??99)));
}
function calcClass(key){
  const st=S.settings,l=log(key); let total=0; const rows=[];
  classesOn(key).forEach(c=>{
    const r=l.cls[c.id]||{}, h=c.days[parse(key).getDay()]||0; let s=0;
    if(r.attend)s+=st.attend; if(r.noLate)s+=st.noLate; if(r.focus)s+=Math.round(st.focusPerHour*h);
    total+=s; rows.push({c,h,r,sum:s});
  });
  return {total,rows};
}
function themeTotal(t,key){ return t.kind==='study'?calcStudy(key).total : t.kind==='class'?calcClass(key).total : calcCheck(t,key).total; }
function dayTotal(key){ return S.themes.reduce((a,t)=>a+themeTotal(t,key),0); }
function grandTotal(){ let t=0; for(const kk in S.logs) t+=dayTotal(kk); return t; }
const ledgerSum=()=>S.ledger.reduce((a,b)=>a+b.amount,0);

/* ============ 네비 ============ */
function go(p){page=p;reorder=false;['home','class','spend','set'].forEach(x=>document.getElementById('n-'+x).classList.toggle('on',x===p));render();}
function setMode(m){mode=m;weekPick=null;render();}
function shift(n){const d=new Date(cur); if(mode==='week')d.setDate(d.getDate()+7*n); else if(mode==='month')d.setMonth(d.getMonth()+n); else d.setDate(d.getDate()+n); cur=d; weekPick=null; render();}

function render(){
  document.documentElement.style.setProperty('--main',S.settings.main);
const tc=document.querySelector('meta[name="theme-color"]'); 
if(tc) tc.setAttribute('content',S.settings.main);
  document.getElementById('tot').textContent=won(grandTotal());
  document.getElementById('bal').textContent=won(grandTotal()+ledgerSum());
  const show=page==='home';
  document.getElementById('segs').style.display=show?'flex':'none';
  document.getElementById('datebar').style.display=show?'flex':'none';
  [...document.querySelectorAll('#segs button')].forEach((b,i)=>b.classList.toggle('on',['day','week','month'][i]===mode));
  const L=document.getElementById('dlabel');
  if(mode==='week'){const[a,b]=weekRange(cur);L.textContent=`${a.getMonth()+1}.${a.getDate()} – ${b.getMonth()+1}.${b.getDate()} ▾`;}
  else if(mode==='month') L.textContent=`${cur.getFullYear()}. ${cur.getMonth()+1} ▾`;
  else L.textContent=`${cur.getFullYear()}. ${cur.getMonth()+1}. ${cur.getDate()} (${DAYS[cur.getDay()]}) ▾`;
  document.getElementById('app').innerHTML =
    page==='home' ? (mode==='day'?viewDay():mode==='week'?viewWeek():viewMonth())
    : page==='class'?viewClass() : page==='spend'?viewSpend() : viewSet();
  bind();
}

/* ============ 체크 버튼 스타일 ============ */
function ckStyle(on,color){ return on?` style="background:${color};border-color:${color};box-shadow:0 0 0 4px color-mix(in srgb,${color} 25%,transparent)"`:''; }

/* ============ 홈 · 일간 ============ */
function themeCard(t,key,i){
  const tot=themeTotal(t,key);
  const head=`<h2>${reorder?`<span class="grip">≡</span>`:''}<span class="dot" style="background:${t.color}"></span>${esc(t.name)}
    ${reorder?`<button class="btn xs ghost" onclick="event.stopPropagation();mv(${i},-1)">▲</button><button class="btn xs ghost" onclick="event.stopPropagation();mv(${i},1)">▼</button>`:''}
    <span class="pay" style="color:${t.color}">${won(tot)}</span></h2>`;
  let body='';
  if(t.kind==='study'){
    const s=calcStudy(key),l=log(key);
    body=`<div class="tinput">
      <input type="number" id="sh" value="${Math.floor(l.studySec/3600)}" min="0"><em>h</em>
      <input type="number" id="sm" value="${Math.floor(l.studySec%3600/60)}" min="0"><em>m</em>
      <input type="number" id="ss" value="${l.studySec%60}" min="0"><em>s</em>
     </div>
    <div class="chips" style="justify-content:center">
      <button class="chip" onclick="addStudy(1800)">+30분</button>
      <button class="chip" onclick="addStudy(3600)">+1시간</button>
      <button class="chip" onclick="addStudy(-1800)">−30분</button>
      <button class="chip" onclick="resetStudy()">초기화</button></div>
    <div class="row">기본 <span class="g">${s.n}단위 × ${won(S.settings.studyUnit)} = ${won(s.base)}</span></div>
    <div class="row">인센티브 <span class="g">${won(s.inc)}</span></div>
    <div class="row" style="align-items:flex-start">
      <span>마일스톤 <button class="btn xs ghost" onclick="openBase('${key.slice(0,7)}')">⚙︎</button></span>
      <span class="g">${s.ms.length?s.ms.map(m=>`${m[0]} +${won(m[1])}`).join('<br>'):'—'}</span></div>
    <div class="muted mono" style="margin-top:8px">전월 평균 ${hm(s.b.prev)} · 연 평균 ${hm(s.b.year)} · 최고 ${hm(s.b.best)}</div>`;
  } else if(t.kind==='class'){
    const c=calcClass(key), fold=S.settings.classFold;
    body=`<div class="row nb" style="padding-top:0"><button class="btn xs ghost" onclick="foldClass()">${fold?'▸ 펼치기':'▾ 접기'}</button>
      <span class="g">${c.rows.length}개 수업</span></div>
      ${fold?'':(c.rows.length?c.rows.map(r=>`
      <div class="item"><div class="t"><span class="dot" style="background:${t.color}"></span>${esc(r.c.name)}
        <span class="muted" style="font-weight:600">${r.h}시수</span>
        <span style="margin-left:auto;color:${t.color};font-weight:800">${won(r.sum)}</span></div>
       <div class="row">출석 <span class="g">${won(S.settings.attend)}</span><button class="ck ${r.r.attend?'on':''}"${ckStyle(r.r.attend,t.color)} onclick="tgc('${r.c.id}','attend')"></button></div>
        <div class="row">지각 X <span class="g">${won(S.settings.noLate)}</span><button class="ck ${r.r.noLate?'on':''}"${ckStyle(r.r.noLate,t.color)} onclick="tgc('${r.c.id}','noLate')"></button></div>
        <div class="row">집중 ${S.settings.focusRate}%↑ <span class="g">${won(Math.round(S.settings.focusPerHour*r.h))}</span><button class="ck ${r.r.focus?'on':''}"${ckStyle(r.r.focus,t.color)} onclick="tgc('${r.c.id}','focus')"></button></div>
      </div>`).join(''):`<div class="muted">오늘 수업 없음</div>`)}`;
  } else {
    const c=log(key).check[t.id]||{};
    body=(t.items||[]).map(i=>`<div class="row">${esc(i.label)} <span class="g">${won(i.amount)}</span>
      <button class="ck ${c[i.id]?'on':''}"${ckStyle(c[i.id],t.color)} onclick="tgi('${t.id}','${i.id}')"></button></div>`).join('')
      ||'<div class="muted">설정에서 항목을 추가하세요</div>';
  }
  return `<div class="card ${reorder?'reorder':''}" data-i="${i}">${head}${body}</div>`;
}
function viewDay(){
  const key=k(cur);
  return S.themes.map((t,i)=>themeCard(t,key,i)).join('')+
  `<div class="card" style="text-align:center">
     <div class="muted">${reorder?'순서 변경 중 — 완료하려면 아무 카드나 길게 누르세요':'오늘 적립'}</div>

function detailCard(key){

      rows+=`<div class="row"><b>${esc(t.name)}</b><span class="g mono">${hm(s.sec)} · 기본 ${won(s.base)} / 인센 ${won(s.inc)}${s.ms.length?' / MS '+won(s.msSum):''}</span></div>`;}
    else if(t.kind==='class'){const c=calcClass(key); c.rows.forEach(r=>{ if(r.sum) rows+=`<div class="row">${esc(r.c.name)}<span class="g">${[r.r.attend&&'출석',r.r.noLate&&'지각X',r.r.focus&&'집중'].filter(Boolean).join('·')} ${won(r.sum)}</span></div>`;});}

/* ============ 클라우드 동기화 (Supabase) ============ */
let sb=null;
let toastT=null;
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400);
}
function ensureSupabase(){
  const c=S.settings.cloud;
  if(!c||!c.url||!c.key) return null;
  if(!window.supabase){ console.error('supabase-js 라이브러리가 로드되지 않았습니다'); return null; }
  if(!sb||sb._url!==c.url||sb._key!==c.key){
    sb=window.supabase.createClient(c.url,c.key);
    sb._url=c.url; sb._key=c.key;
  }
  return sb;
}
  function saveCloud(){
  S.settings.cloud={
    url:document.getElementById('cu_url').value.trim(),
    key:document.getElementById('cu_key').value.trim(),
    code:document.getElementById('cu_code').value.trim()
  };
  save(); alert('저장되었습니다. "지금 업로드"를 눌러 첫 동기화를 해보세요.');
}
async function pushCloud(silent){
  const c=S.settings.cloud;
  if(!c||!c.url||!c.key||!c.code){ if(!silent) alert('먼저 설정에서 Supabase URL / Key / 동기화 코드를 저장하세요'); return; }
  const client=ensureSupabase();
  if(!client){ if(!silent) alert('Supabase 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'); else showToast('⚠️ 라이브러리 로드 실패'); return; }
  try{
    const {error}=await client.from('app_data').upsert({sync_code:c.code, data:S, updated_at:new Date().toISOString()});
    if(error) throw error;
    if(!silent) alert('업로드 완료'); else showToast('☁️ 자동 업로드 완료');
  }catch(e){ if(!silent) alert('업로드 실패: '+e.message); else{ showToast('⚠️ 자동 업로드 실패'); console.error('pushCloud error',e); } }
}
  async function pullCloud(){
  const c=S.settings.cloud;
  if(!c||!c.url||!c.key||!c.code){ alert('먼저 설정에서 Supabase URL / Key / 동기화 코드를 저장하세요'); return; }
  const client=ensureSupabase();
  if(!client){ alert('Supabase 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'); return; }
  try{
    const {data,error}=await client.from('app_data').select('data').eq('sync_code',c.code).single();
    if(error) throw error;
    if(data&&data.data){
      const cloudCfg=c;
      S=data.data;
      S.settings=S.settings||{};
      S.settings.cloud=cloudCfg;
      save(); alert('다운로드 완료'); go('home');
    } else {
      alert('클라우드에 저장된 데이터가 아직 없어요. 먼저 이 기기에서 "지금 업로드"를 눌러주세요.');
    }
  }catch(e){ alert('다운로드 실패: '+e.message); }
}

  const[ws,we]=weekRange(cur); const wsk=k(ws), wek=k(we);
  let cells=''; for(let i=0;i<first;i++)cells+='<button class="off"></button>';
  for(let i=1;i<=nd;i++){const kk=k(new Date(y,m,i)); const inwk=mode!=='day'&&kk>=wsk&&kk<=wek;
    cells+=`<button class="${kk===k(cur)&&mode==='day'?'sel':''} ${inwk?'inwk':''} ${kk===today?'tod':''}" onclick="pick('${kk}')">${i}</button>`;}
  document.getElementById('modal').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">
    <h3>${mode==='week'?'주차 선택':mode==='month'?'월 선택':'날짜 선택'}
      <span style="float:right"><button class="btn xs ghost" onclick="navM(-1)">‹</button>
      <b style="padding:0 6px">${y}.${m+1}</b>
      <button class="btn xs ghost" onclick="navM(1)">›</button></span></h3>
    <div class="cal">${['월','화','수','목','금','토','일'].map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div>
    <div class="g2" style="margin-top:12px">
      <button class="btn ghost" onclick="pick('${today}')">오늘</button>
      <button class="btn" onclick="closeM()">닫기</button></div></div></div>`;
}
function navM(n){cur.setDate(1);cur.setMonth(cur.getMonth()+n);openCal();}
function pick(kk){cur=parse(kk);weekPick=null;closeM();render();}

function openBase(m){
  const b=S.base[m]||baseOf(m+'-01');
  const t=(id,sec)=>`<div class="tinput"><input type="number" id="${id}h" value="${Math.floor(sec/3600)}"><em>h</em>
    <input type="number" id="${id}m" value="${Math.floor(sec%3600/60)}"><em>m</em>
    <input type="number" id="${id}s" value="${sec%60}"><em>s</em></div>`;
  document.getElementById('modal').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">
    <h3>마일스톤 기준 · <input type="month" id="bm" value="${m}" style="width:auto;padding:4px 8px" onchange="openBase(this.value)"></h3>
    <div class="f"><label>전월 대비 하루 평균</label>${t('b_prev',b.prev)}</div>
    <div class="f"><label>연 대비 하루 평균</label>${t('b_year',b.year)}</div>
    <div class="f"><label>연간 최고기록</label>${t('b_best',b.best)}</div>
    <div class="muted">이 달에만 적용되는 기준입니다. 비우고 삭제하면 자동 계산값을 씁니다.</div>
    <div class="g2" style="margin-top:12px">
      <button class="btn ghost" onclick="delBase('${m}')">삭제(자동)</button>
      <button class="btn" onclick="saveBase('${m}')">저장</button></div>
    ${Object.keys(S.base).length?`<div class="sec">저장된 월</div>${Object.keys(S.base).sort().map(x=>`<div class="row"><b>${x}</b><span class="g mono">전월 ${hm(S.base[x].prev)} · 연 ${hm(S.base[x].year)} · 최고 ${hm(S.base[x].best)}</span></div>`).join('')}`:''}
  </div></div>`;
}
function saveBase(m){
  const g=id=>parseInt(document.getElementById(id).value)||0;
  const t=p=>g(p+'h')*3600+g(p+'m')*60+g(p+'s');
  S.base[m]={prev:t('b_prev'),year:t('b_year'),best:t('b_best')}; save(); closeM(); render();
}
function delBase(m){delete S.base[m];save();closeM();render();}

// 두 번째 코드에 추가된 부분
function openEditLed(i){
  const e=S.ledger[i]; if(!e)return;
  document.getElementById('modal').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">
    <h3>내역 수정</h3>
    <div class="g2">
      <div class="f"><label>날짜</label><input type="date" id="ed_d" value="${e.date}"></div>
      <div class="f"><label>금액 (+입금 / −지출)</label><input type="number" id="ed_a" value="${e.amount}"></div></div>
    <div class="f"><label>내용</label><input type="text" id="ed_m" value="${esc(e.memo||'')}"></div>
    <div class="g2" style="margin-top:12px">
      <button class="btn ghost" onclick="delLed(${i});closeM()">삭제</button>
      <button class="btn" onclick="saveEditLed(${i})">저장</button></div>
  </div></div>`;
}
function saveEditLed(i){
  const d=document.getElementById('ed_d').value;
  const a=parseInt(document.getElementById('ed_a').value)||0;
  const m=document.getElementById('ed_m').value.trim();
  S.ledger[i]={date:d,amount:a,memo:m};
  save();closeM();render();
}

/* ============ 액션 ============ */
function saveStudy(){const g=i=>Math.max(0,parseInt(document.getElementById(i).value)||0);
  log(k(cur)).studySec=g('sh')*3600+g('sm')*60+g('ss');save();render();}
function addStudy(d){const l=log(k(cur));l.studySec=Math.max(0,l.studySec+d);save();render();}
function resetStudy(){if(confirm('오늘 공부 시간을 0으로 초기화할까요?')){log(k(cur)).studySec=0;save();render();}}
function tgi(t,i){const c=log(k(cur)).check;c[t]=c[t]||{};c[t][i]=!c[t][i];save();render();}
function tgc(id,f){const l=log(k(cur));l.cls[id]=l.cls[id]||{};l.cls[id][f]=!l.cls[id][f];save();render();}
function foldClass(){S.settings.classFold=!S.settings.classFold;save();render();}
function mv(i,d){const j=i+d;if(j<0||j>=S.themes.length)return;[S.themes[i],S.themes[j]]=[S.themes[j],S.themes[i]];save();render();}
function editT(i,f,v){S.themes[i][f]=v;save();if(f==='color')render();}
function delT(i){if(confirm('테마를 삭제할까요?')){S.themes.splice(i,1);save();render();}}
function addT(){S.themes.push({id:'t'+Date.now(),name:'새 테마',color:'#9b7ede',kind:'check',items:[]});save();render();}
function addI(i){S.themes[i].items=S.themes[i].items||[];S.themes[i].items.push({id:'i'+Date.now(),label:'새 항목',amount:1000});save();render();}
function editI(i,j,f,v){S.themes[i].items[j][f]=f==='amount'?(parseInt(v)||0):v;save();}
function delI(i,j){S.themes[i].items.splice(j,1);save();render();}
function addClass(){
  const name=document.getElementById('cn').value.trim();if(!name)return alert('과목명을 입력하세요');
  const days={},ord={};[0,1,2,3,4,5,6].forEach(w=>{days[w]=parseFloat(document.getElementById('cd'+w).value)||0;ord[w]=S.classes.length;});
  S.classes.push({id:'c'+Date.now(),name,start:document.getElementById('cs').value,end:document.getElementById('ce').value,days,ord});
  save();render();
}
function editC(id,f,v){const c=S.classes.find(x=>x.id===id);c[f]=v;save();}
function editDay(id,w,v){const c=S.classes.find(x=>x.id===id);c.days[w]=parseFloat(v)||0;c.ord=c.ord||{};if(c.ord[w]==null)c.ord[w]=99;save();render();}
function ordMove(id,w,d){
  const list=S.classes.filter(c=>(c.days?.[w]||0)>0).sort((a,b)=>((a.ord?.[w]??99)-(b.ord?.[w]??99)));
  const i=list.findIndex(c=>c.id===id),j=i+d; if(j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  list.forEach((c,n)=>{c.ord=c.ord||{};c.ord[w]=n;}); save();render();
}
function delClass(id){if(confirm('삭제할까요?')){S.classes=S.classes.filter(c=>c.id!==id);save();render();}}
function addLed(sign){
  let a=parseInt(document.getElementById('pa').value)||0; if(!a)return alert('금액을 입력하세요');
  if((sign<0&&a>0)||(sign>0&&a<0)) a=-a;
  S.ledger.push({date:document.getElementById('pd').value,amount:a,memo:document.getElementById('pm').value.trim()});
  save();render();
}
function delLed(i){S.ledger.splice(i,1);save();render();}
function saveSet(){
  const g=i=>{const e=document.getElementById(i);return e?(parseInt(e.value)||0):0;};
  ['studyUnit','incA','incB','msPrevMonth','msYear','msBest','attend','noLate','focusPerHour','focusRate'].forEach(f=>S.settings[f]=g('f_'+f));
  save();alert('저장되었습니다');render();
}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chingchan-'+k(new Date())+'.json';a.click();}

/* ============ 길게 눌러 순서 변경 + 드래그 ============ */
let lpT=null, dragI=null;
function bind(){
  const f=document.getElementById('ttf');
  if(f)f.onchange=e=>{const x=e.target.files[0];if(!x)return;const r=new FileReader();r.onload=()=>{S.tt=r.result;save();render();};r.readAsDataURL(x);};
  const im=document.getElementById('imp');
  if(im)im.onchange=e=>{const x=e.target.files[0];if(!x)return;const r=new FileReader();
    r.onload=()=>{try{S=JSON.parse(r.result);save();alert('복원 완료');go('home');}catch(z){alert('파일을 읽을 수 없습니다');}};r.readAsText(x);};

  if(page==='home'&&mode==='day'){
    document.querySelectorAll('.card[data-i]').forEach(el=>{
      const start=()=>{lpT=setTimeout(()=>{reorder=!reorder;if(navigator.vibrate)navigator.vibrate(30);render();},550);};
      const stop=()=>{clearTimeout(lpT);};
      el.addEventListener('touchstart',start,{passive:true});
      el.addEventListener('touchend',stop); el.addEventListener('touchmove',stop);
      el.addEventListener('mousedown',start); el.addEventListener('mouseup',stop); el.addEventListener('mouseleave',stop);
      if(reorder){
        el.draggable=true;
        el.ondragstart=()=>{dragI=+el.dataset.i;el.classList.add('drag');};
        el.ondragover=e=>e.preventDefault();
        el.ondrop=()=>{const t=+el.dataset.i;if(dragI!=null&&dragI!==t){const[x]=S.themes.splice(dragI,1);S.themes.splice(t,0,x);save();render();}};
        el.ondragend=()=>{el.classList.remove('drag');dragI=null;};
      }
    });
  }
}
(async function init(){
  // 1. 빈 화면에서 멈추지 않도록 로컬 데이터로 화면을 먼저 그립니다.
  render();

  const c=S.settings.cloud;
  if(c&&c.url&&c.key&&c.code&&!c.url.includes('여기에')){
    try{
      const client=ensureSupabase();
      if(client){
        const {data,error}=await client.from('app_data').select('data').eq('sync_code',c.code).single();
        if(!error&&data&&data.data){
          const cfg=c;
          S=data.data;
          S.settings=S.settings||{};
          S.settings.cloud=cfg;
          localStorage.setItem(KEY,JSON.stringify(S));
          
          // 2. 클라우드에서 새 데이터를 성공적으로 받아오면 화면을 다시 그립니다.
          render();
          showToast('☁️ 클라우드에서 최신 데이터를 불러왔습니다');
          return;
        } else if(error){
          console.error('init pull error',error);
          showToast('⚠️ 클라우드 연결 실패 (설정값 확인)');
          return;
        } else {
          showToast('☁️ 클라우드에 아직 데이터 없음 — "지금 업로드"를 눌러주세요');
          return;
        }
      }
    }catch(e){
      console.error('init error',e);
      showToast('⚠️ 클라우드 연결 실패');
      return;
    }
  }
})();

</script>
